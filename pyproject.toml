[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptomoney"
version = "0.1.0"
description = "Crypto amounts without float bugs: decimal money, per-asset precision, satoshi and wei units, parsing and formatting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["crypto", "decimal", "money", "satoshi", "wei", "bitcoin", "ethereum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/polycratia/cryptomoney"
Source = "https://github.com/polycratia/cryptomoney"
Issues = "https://github.com/polycratia/cryptomoney/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptomoney"]

[tool.hatch.build.targets.sdist]
include = ["src/cryptomoney", "README.md", "LICENSE"]
